name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Tests in QGIS Docker
        run: |
          docker run --rm -v $(pwd):/tests -w /tests qgis/qgis:latest \
            sh -c "pip install --break-system-packages -r /tests/requirements.txt && export PYTHONPATH=/tests:\$PYTHONPATH && python3 -c \"import sys; print('PYTHONPATH:', sys.path); import unittest; loader = unittest.TestLoader(); suite = loader.discover('tests'); runner = unittest.TextTestRunner(verbosity=2); result = runner.run(suite); sys.exit(0 if result.wasSuccessful() else 1)\""
